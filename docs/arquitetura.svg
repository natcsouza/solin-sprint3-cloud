<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1010" viewBox="0 0 1520 1010" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="seta" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#4A6274"/>
    </marker>
    <marker id="setaAzul" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#0F6CBD"/>
    </marker>
    <marker id="setaVerde" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L11,4 L0,8 z" fill="#107C41"/>
    </marker>
    <style>
      .t   { font-size:14px; fill:#1B3A57 }
      .tb  { font-size:14px; fill:#1B3A57; font-weight:600 }
      .ts  { font-size:12px; fill:#5A7185 }
      .tm  { font-size:11px; fill:#6B8296 }
      .rec { font-size:15px; font-weight:600; fill:#12324D }
      .cx  { fill:#fff; stroke:#B9CBDA; stroke-width:1.5; rx:9 }
      .num { font-size:13px; font-weight:700; fill:#fff }
    </style>
  </defs>

  <rect width="1520" height="1010" fill="#FBFCFD"/>

  <!-- ================= TITULO ================= -->
  <text x="40" y="42" font-size="23" font-weight="700" fill="#0F6CBD">SOLIN — Arquitetura da solução na nuvem</text>
  <text x="40" y="66" class="t">Challenge 2026 CLYVO VET · Sprint 3 · Opção 1: Azure Container Registry + Azure Container Instances</text>
  <text x="40" y="86" class="ts">Grupo SOLIN · RM 564099 · FIAP 2TDSR · DevOps Tools &amp; Cloud Computing</text>

  <!-- ================= AMBIENTE DE DESENVOLVIMENTO ================= -->
  <rect x="36" y="112" width="330" height="392" rx="14" fill="#EAF6EE" stroke="#7FC79B" stroke-width="2"/>
  <text x="201" y="140" text-anchor="middle" class="rec" fill="#0B5C31">Ambiente de desenvolvimento</text>
  <text x="201" y="160" text-anchor="middle" class="tm">máquina local · fora da Azure</text>

  <rect x="64" y="180" width="274" height="66" class="cx"/>
  <text x="80" y="206" class="tb">GitHub — código-fonte</text>
  <text x="80" y="228" class="ts">natcsouza/solin-sprint3-cloud</text>

  <rect x="64" y="278" width="274" height="76" class="cx"/>
  <text x="80" y="304" class="tb">Dockerfile do App e do Banco</text>
  <text x="80" y="324" class="ts">multi-stage · imagem final sem JDK</text>
  <text x="80" y="342" class="ts">USER solinuser — sem privilégio</text>

  <rect x="64" y="386" width="274" height="76" class="cx"/>
  <text x="80" y="412" class="tb">docker compose — teste local</text>
  <text x="80" y="432" class="ts">valida app + banco antes da nuvem</text>
  <text x="80" y="450" class="ts">volume nomeado para persistência</text>

  <path d="M201,246 L201,278" stroke="#107C41" stroke-width="2" marker-end="url(#setaVerde)"/>
  <path d="M201,354 L201,386" stroke="#107C41" stroke-width="2" marker-end="url(#setaVerde)"/>

  <!-- ================= CLOUD SHELL ================= -->
  <rect x="36" y="540" width="330" height="150" rx="14" fill="#EAF3FB" stroke="#0F6CBD" stroke-width="2"/>
  <text x="201" y="570" text-anchor="middle" class="rec">Azure Cloud Shell — az CLI</text>
  <text x="56" y="596" class="ts">Todo o provisionamento sai daqui.</text>
  <text x="56" y="618" class="ts">9 scripts versionados em scripts/ :</text>
  <text x="56" y="640" class="tm">01-criar-acr · 02-build-e-push · 03-criar-storage</text>
  <text x="56" y="658" class="tm">04-criar-aci-banco · 05-criar-aci-app</text>
  <text x="56" y="676" class="tm">06-testes-crud · 07-provar-persistencia · 99-limpar</text>

  <!-- ================= CLIENTE ================= -->
  <rect x="1108" y="112" width="330" height="92" class="cx"/>
  <text x="1128" y="140" class="tb">Cliente — CLYVO VET</text>
  <text x="1128" y="162" class="ts">navegador, Postman ou curl</text>
  <text x="1128" y="184" class="tm">http://564099-solin-app.eastus2.azurecontainer.io:8080/solin</text>

  <!-- ================= AZURE ================= -->
  <rect x="404" y="228" width="1084" height="462" rx="16" fill="#EDF4FB" stroke="#0F6CBD" stroke-width="2.5"/>
  <text x="428" y="258" class="rec">Microsoft Azure — assinatura Azure for Students</text>
  <text x="428" y="278" class="tm">política da assinatura libera apenas: canadacentral · southcentralus · chilecentral · eastus2 · northcentralus</text>

  <!-- grupo de recursos -->
  <rect x="428" y="298" width="1036" height="368" rx="12" fill="#FFFFFF" stroke="#9FC5E4" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="448" y="324" class="tb" fill="#0B4F87">Grupo de recursos: rg-564099-solin · região eastus2</text>

  <!-- ACR -->
  <rect x="452" y="344" width="290" height="104" class="cx" stroke="#0F6CBD"/>
  <text x="470" y="372" class="tb">Azure Container Registry</text>
  <text x="470" y="394" class="ts">acr564099solin.azurecr.io</text>
  <text x="470" y="416" class="tm">564099-solin-app:1.0</text>
  <text x="470" y="434" class="tm">564099-solin-db:1.0</text>

  <!-- VM de build -->
  <rect x="782" y="344" width="290" height="104" rx="9" fill="#FFF8EC" stroke="#E8A33D" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="800" y="372" class="tb" fill="#8A5B12">VM Linux — apenas build</text>
  <text x="800" y="394" class="ts">Standard_B2als_v2 · canadacentral</text>
  <text x="800" y="416" class="tm">o Cloud Shell não tem daemon Docker</text>
  <text x="800" y="434" class="tm">TEMPORÁRIA — excluída ao final</text>

  <!-- Storage -->
  <rect x="1112" y="344" width="328" height="104" class="cx" stroke="#0F6CBD"/>
  <text x="1130" y="372" class="tb">Storage Account + File Share</text>
  <text x="1130" y="394" class="ts">stsolinfiap2026 / solin-mysql</text>
  <text x="1130" y="416" class="tm">montado em /var/lib/mysql</text>
  <text x="1130" y="434" class="tm">o dado vive aqui, não no container</text>

  <!-- ACI app -->
  <rect x="452" y="500" width="290" height="132" class="cx" stroke="#107C41" stroke-width="2"/>
  <text x="470" y="528" class="tb" fill="#0B5C31">ACI — aplicação</text>
  <text x="470" y="550" class="ts">aci-564099-solin-app</text>
  <text x="470" y="572" class="tm">Spring Boot 3.2 · porta 8080</text>
  <text x="470" y="590" class="tm">USER solinuser — não é root</text>
  <text x="470" y="612" class="tm">senhas via secure-environment-variables</text>

  <!-- ACI db -->
  <rect x="782" y="500" width="290" height="132" class="cx" stroke="#107C41" stroke-width="2"/>
  <text x="800" y="528" class="tb" fill="#0B5C31">ACI — banco de dados</text>
  <text x="800" y="550" class="ts">aci-564099-solin-db</text>
  <text x="800" y="572" class="tm">MySQL 8.0 em container · porta 3306</text>
  <text x="800" y="590" class="tm">schema criado por script_bd.sql</text>
  <text x="800" y="612" class="tm">5 tabelas · FK_PET_TUTOR</text>

  <!-- ============ SETAS ============ -->

  <!-- 3: VM -> ACR (docker push) -->
  <path d="M782,396 L746,396" stroke="#4A6274" stroke-width="2.5" marker-end="url(#seta)"/>
  <text x="764" y="388" text-anchor="middle" class="tm">push</text>

  <!-- 4: Cloud Shell -> grupo de recursos -->
  <path d="M366,600 C400,600 410,540 428,470" stroke="#0F6CBD" stroke-width="2.5" fill="none" marker-end="url(#setaAzul)"/>

  <!-- 5: ACR -> ACIs (pull) -->
  <path d="M560,448 L560,500" stroke="#0F6CBD" stroke-width="2" marker-end="url(#setaAzul)"/>
  <path d="M680,448 C760,470 830,478 860,500" stroke="#0F6CBD" stroke-width="2" fill="none" marker-end="url(#setaAzul)"/>

  <!-- 6: app <-> db -->
  <path d="M742,566 L782,566" stroke="#107C41" stroke-width="2.5" marker-end="url(#setaVerde)"/>
  <text x="762" y="558" text-anchor="middle" class="tm" fill="#0B5C31">JDBC</text>

  <!-- 7: db -> file share -->
  <path d="M1072,548 C1180,548 1240,500 1260,448" stroke="#0F6CBD" stroke-width="2.5" fill="none" marker-end="url(#setaAzul)"/>

  <!-- 8: cliente -> ACI app (contorna por fora, sem cruzar nada) -->
  <path d="M1108,158 L388,158 L388,566 L446,566" stroke="#4A6274" stroke-width="2"
        fill="none" marker-end="url(#seta)" stroke-dasharray="8 4"/>
  <text x="748" y="150" text-anchor="middle" class="tm">HTTP :8080 · /solin/api</text>

  <!-- ============ NUMEROS ============ -->
  <g>
    <circle cx="201" cy="180" r="14" fill="#107C41"/><text x="201" y="185" text-anchor="middle" class="num">1</text>
    <circle cx="201" cy="278" r="14" fill="#107C41"/><text x="201" y="283" text-anchor="middle" class="num">2</text>
    <circle cx="927" cy="336" r="14" fill="#4A6274"/><text x="927" y="341" text-anchor="middle" class="num">3</text>
    <circle cx="404" cy="512" r="14" fill="#0F6CBD"/><text x="404" y="517" text-anchor="middle" class="num">4</text>
    <circle cx="560" cy="474" r="14" fill="#0F6CBD"/><text x="560" y="479" text-anchor="middle" class="num">5</text>
    <circle cx="762" cy="596" r="14" fill="#107C41"/><text x="762" y="601" text-anchor="middle" class="num">6</text>
    <circle cx="1200" cy="490" r="14" fill="#0F6CBD"/><text x="1200" y="495" text-anchor="middle" class="num">7</text>
    <circle cx="1090" cy="228" r="14" fill="#4A6274"/><text x="1090" y="233" text-anchor="middle" class="num">8</text>
  </g>

  <!-- ============ LEGENDA ============ -->
  <line x1="36" y1="722" x2="1484" y2="722" stroke="#D4E0EA" stroke-width="1.5"/>
  <text x="36" y="750" class="rec">Fluxo da entrega</text>

  <g>
    <circle cx="50" cy="782" r="13" fill="#107C41"/><text x="50" y="787" text-anchor="middle" class="num">1</text>
    <text x="76" y="787" class="t">Código versionado no GitHub — o vídeo começa com o <tspan font-family="Consolas,monospace" font-size="13">git clone</tspan> do repositório.</text>

    <circle cx="50" cy="818" r="13" fill="#107C41"/><text x="50" y="823" text-anchor="middle" class="num">2</text>
    <text x="76" y="823" class="t">Dockerfiles do App e do Banco; o <tspan font-family="Consolas,monospace" font-size="13">docker compose</tspan> valida o conjunto localmente antes da nuvem.</text>

    <circle cx="50" cy="854" r="13" fill="#4A6274"/><text x="50" y="859" text-anchor="middle" class="num">3</text>
    <text x="76" y="859" class="t"><tspan font-family="Consolas,monospace" font-size="13">docker build</tspan> e <tspan font-family="Consolas,monospace" font-size="13">docker push</tspan> rodam na VM Linux e publicam as duas imagens no ACR.</text>

    <circle cx="50" cy="890" r="13" fill="#0F6CBD"/><text x="50" y="895" text-anchor="middle" class="num">4</text>
    <text x="76" y="895" class="t">Todos os recursos são criados por <tspan font-family="Consolas,monospace" font-size="13">az</tspan> CLI, a partir dos scripts versionados — nada é criado pelo portal.</text>

    <circle cx="790" cy="782" r="13" fill="#0F6CBD"/><text x="790" y="787" text-anchor="middle" class="num">5</text>
    <text x="816" y="787" class="t">Cada ACI puxa a sua imagem do ACR com credencial do próprio registro.</text>

    <circle cx="790" cy="818" r="13" fill="#107C41"/><text x="790" y="823" text-anchor="middle" class="num">6</text>
    <text x="816" y="823" class="t">A aplicação conversa com o banco por JDBC, dentro do grupo de recursos.</text>

    <circle cx="790" cy="854" r="13" fill="#0F6CBD"/><text x="790" y="859" text-anchor="middle" class="num">7</text>
    <text x="816" y="859" class="t">O MySQL grava no File Share: o container é descartável, o dado não.</text>

    <circle cx="790" cy="890" r="13" fill="#4A6274"/><text x="790" y="895" text-anchor="middle" class="num">8</text>
    <text x="816" y="895" class="t">O cliente consome a API pelo FQDN público do ACI, na porta 8080.</text>
  </g>

  <line x1="36" y1="930" x2="1484" y2="930" stroke="#D4E0EA" stroke-width="1.5"/>
  <text x="36" y="958" class="ts">Containerização completa: <tspan font-weight="600">App e Banco</tspan> rodam em container na nuvem — sem misturar com serviços PaaS, como exige a Opção 1.</text>
  <text x="36" y="980" class="ts">A VM Linux não hospeda nada da solução: existe só para compilar as imagens e é excluída junto com o grupo de recursos, no passo 11 do README.</text>
</svg>
