spring.application.name=solin-api

# =====================================================================
# Banco de dados
#
# Nenhuma credencial fica no codigo. Host, porta, base, usuario e senha
# chegam por variavel de ambiente: no teste local pelo docker-compose,
# na nuvem pelo "az container create" (a senha vai como
# --secure-environment-variables, que nao aparece no portal).
# =====================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O MySQL derruba conexao ociosa (wait_timeout). Sem estes limites o pool
# guarda conexao morta e a primeira requisicao depois de um tempo parado
# falha com "No operations allowed after connection closed".
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-test-query=SELECT 1

# =====================================================================
# JPA
#
# "none": quem cria e versiona o schema e o script_bd.sql. A aplicacao
# NUNCA cria, altera ou apaga estrutura do banco - nem mesmo sem querer,
# como aconteceria com "update".
#
# Nao usamos "validate" porque o Hibernate 6 mapeia @Enumerated(STRING)
# para o tipo nativo ENUM do MySQL, e o DDL usa VARCHAR. Manter VARCHAR
# foi decisao consciente: o valor fica legivel num SELECT e incluir um
# novo item no enum nao exige ALTER TABLE.
# =====================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Por padrao o Spring Boot converte todo nome de tabela/coluna para
# minusculo, mesmo os declarados em @Table("TB_TUTOR"). No MySQL em
# Linux o nome e case-sensitive, entao ele procuraria "tb_tutor" e nao
# acharia a tabela criada pelo DDL. Esta estrategia faz o Hibernate
# respeitar exatamente o nome escrito na entidade.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# No MySQL, o Hibernate 6 mapeia @Enumerated(STRING) para o tipo nativo
# ENUM('valor1','valor2'). Preferimos VARCHAR: o valor continua legivel
# no banco e incluir um novo item no enum nao exige ALTER TABLE.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
# Mantido como no projeto original: os mappers percorrem as colecoes
# (tutor.pets, pet.eventos) ao montar a resposta, e elas sao LAZY.
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Servidor =====
server.port=8080
server.servlet.context-path=/solin

# ===== Paginacao =====
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# ===== Swagger =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===== Cache (simples, em memoria) =====
spring.cache.type=simple
